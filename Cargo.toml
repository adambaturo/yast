[package]
name = "yast"
version = "0.1.3"
edition = "2021"
description = "Fast, content-based directory comparison and safe synchronization"
license = "MIT"
repository = "https://github.com/adambaturo/yast"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
csv = "1"
digest = "0.11"
filetime = "0.2"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
md-5 = "0.11"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
trash = "5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2"

