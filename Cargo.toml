[package]
name = "yast"
version = "0.1.1"
edition = "2021"
description = "Fast, content-based directory comparison and safe synchronization"
license = "MIT"
repository = "https://github.com/adambaturo/yast"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
csv = "1"
digest = "0.10"
filetime = "0.2"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
md-5 = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
assert_cmd = "2"

